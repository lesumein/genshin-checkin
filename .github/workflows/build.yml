name: Build APK

# main에 푸시하면 서명된 APK를 아티팩트로 올린다.
# v* 태그를 푸시하거나, 수동 실행에서 release에 v0.1.0 같은 이름을 넣으면 릴리스로 올린다.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "릴리스 태그 (예: v0.1.0). 비우면 빌드만 한다."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 시크릿이 없습니다. README의 '서명 키' 절을 보세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk genshin-checkin.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: genshin-checkin-apk
          path: genshin-checkin.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        # 태그가 없으면 현재 커밋에 새로 만든다.
        run: gh release create "$TAG" genshin-checkin.apk --title "$TAG" --target "$GITHUB_SHA" --generate-notes
