name: Build login test app

# 로그인 문제 진단용 테스트 앱(logintest 모듈)을 빌드해 미리보기 릴리스로 올린다. 수동 실행만.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "릴리스 태그 (예: logintest-1)"
        required: true
        default: "logintest-1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :logintest:assembleRelease
          mv logintest/build/outputs/apk/release/logintest-release.apk login-test.apk

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: gh release create "$TAG" login-test.apk --title "로그인 테스트 앱 ($TAG)" --target "$GITHUB_SHA" --prerelease --notes "로그인 문제 진단용 테스트 앱. 본 앱과 따로 설치된다."
