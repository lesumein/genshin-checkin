name: Copy signing secrets

# 이 저장소의 서명 시크릿(같은 업로드 키)을 새 앱 저장소에 그대로 넣는다. 수동 실행만.
# 값은 로그에 찍히지 않는다(GitHub이 시크릿을 가린다). 대상은 lesumein 계정의 저장소만 받는다.
# 필요: SECRETS_COPY_TOKEN 시크릿 = 세분화된 개인 액세스 토큰(저장소 권한 'Secrets: Read and write'만).
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "대상 저장소 (예: lesumein/genshin-map-overlay)"
        required: true

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check target
        env:
          REPO: ${{ inputs.repo }}
        run: |
          if ! [[ "$REPO" =~ ^lesumein/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::lesumein/저장소이름 형식만 받아요: $REPO"
            exit 1
          fi
          if [ "$REPO" = "${{ github.repository }}" ]; then
            echo "::error::이 저장소 자신에는 복사하지 않아요."
            exit 1
          fi

      - name: Copy
        env:
          GH_TOKEN: ${{ secrets.SECRETS_COPY_TOKEN }}
          REPO: ${{ inputs.repo }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SECRETS_COPY_TOKEN 시크릿이 없어요."
            exit 1
          fi
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            printf '%s' "${!name}" | gh secret set "$name" -R "$REPO"
          done
          echo "$REPO 에 서명 시크릿 4개를 넣었어요."
